name: Verify Flask API

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start Flask and verify health route
        env:
          FLASK_ENV: development
          DATABASE_URL: postgresql://ci:ci@localhost:5432/health_check
          SECRET_KEY: ci-test-secret
        run: |
          python run.py > flask.log 2>&1 &
          flask_pid=$!

          trap 'kill "$flask_pid"' EXIT

          health_response=""
          health_check_passed=false

          for attempt in {1..30}; do
            response=$(curl --noproxy '*' --fail --silent --show-error http://127.0.0.1:5000/health) && \
              echo "$response" | grep --fixed-strings --quiet '"status":"ok"'
            if [ "$?" -eq 0 ]; then
              health_response="$response"
              health_check_passed=true
              break
            fi
            sleep 1
          done

          {
            echo "## Flask health check"
            echo
            echo "| Check | Status | Response |"
            echo "| --- | --- | --- |"
            if [ "$health_check_passed" = true ]; then
              echo "| GET /health | PASSED | $health_response |"
            else
              echo "| GET /health | FAILED | No valid response |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$health_check_passed" != true ]; then
            cat flask.log
            exit 1
          fi

          echo "$health_response"